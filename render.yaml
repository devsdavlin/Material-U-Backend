services:
  # Backend del inventario. Se despliega desde GitHub con Docker o Node;
  # este archivo deja el plan Node listo: instala, genera el cliente,
  # compila, aplica migraciones y arranca.
  - type: web
    name: material-u-backend
    runtime: node
    buildCommand: npm ci; npm run db:generate; npm run build; npx prisma migrate deploy
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
